<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width">
  <link rel="stylesheet" href="popup.css">
  <title>Apply Desk</title>
</head>
<body>
  <main>
    <p class="brand">A <span>/ APPLY DESK</span></p>
    <h1>Application helper</h1>
    <div id="daily-status" class="status-pill">Today: <strong id="daily-count">0</strong> / 50 applied</div>

    <section class="section-block">
      <p class="section-title">Wellfound Auto-Apply</p>
      <button id="wellfound-auto" class="primary-btn">▶ Start Live Auto-Apply</button>
      <button id="wellfound-dryrun" class="secondary">🧪 Dry Run (Fill, No Submit)</button>
      <button id="wellfound-stop" class="danger-btn" style="display:none;">⏹ Stop Automation</button>
    </section>

    <section class="section-block">
      <p class="section-title">One-Click Auto-Fill (Full Permission)</p>
      <button id="fill-all" class="primary-btn" style="background:#2ecc71; border-color:#27ae60; color:#11120f; font-weight:700;">⚡ Auto-Fill Entire Page / Profile</button>
      <button id="capture" class="secondary">📌 Capture this job</button>
      <button id="log-email" class="secondary">✉️ Log this email</button>
    </section>

    <div class="bottom">
      <button id="settings">⚙ Profile & Settings</button>
      <a href="https://damnsunnyy.github.io/ApplyDesk/" target="_blank">Open tracker ↗</a>
    </div>
    <p id="message" role="status"></p>
  </main>
  <script src="popup.js"></script>
</body>
</html>
